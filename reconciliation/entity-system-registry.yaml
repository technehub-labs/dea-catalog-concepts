# Entity System Registry (CR-CON-02; per the Conformance Standard CS-011)
# Per-repo lightweight slice of the General Entity System. Data-driven
# configuration for the entity-system gate. This repo has 0 entity
# records at the time of CR landing; the registry is declared generically
# (no profiles) so the gate is vacuously CONFORMANT (per the Stage 5
# staging).

envelope:
  file_globs:
    - "entities/**/*.yaml"
  type_field: type
  profiles:
    Concept:
      required_fields: [id, type, name, definition, lifecycle, provenance]
      lifecycle_state_field: lifecycle.status

identity:
  id_field: id
  canonical_prefix: "dea:"
  canonical_pattern: "^dea:concept-[a-z0-9-]+$"
  legacy_prefix: "dea:"
  legacy_pattern: "^dea:concept-[a-z0-9-]+$"
  legacy_migration_map: "reconciliation/migration-id-map.yaml"

relationships:
  field: relationships
  canonical_types:
    - defines
    - broader-than
    - related-to
  forbidden_types:
    - part-of
  type_constraints:
    defines:
      source_types: [Concept]
      target_identity_scopes:
        - dea-catalog-business-capabilities
        - dea-catalog-business-objects
    broader-than:
      source_types: [Concept]
    related-to:
      source_types: [Concept]
  cross_catalog_field: identity_scope

lifecycle:
  field: lifecycle
  status_field: status
  valid_states: [proposed, planned, scaffold, active, deprecated, retired]
  terminal_states: [retired]
  transition_table:
    proposed: [planned]
    planned: [scaffold]
    scaffold: [active]
    active: [deprecated]
    deprecated: [retired, active]
    retired: []
  provenance_field: provenance.change_history
  provenance_required_keys:
    - cr
    - date
    - change

per_type_gates:
  - type: Concept
    gate: scripts/check_target_resolution.py

exceptions:
  registry_path: reconciliation/normalization.yaml
  verdict_key: verdict
  verdict_value: review-retained
  cr_key: cr
  expiry_key: expiry
  reviewer_key: reviewed_by
  excepted_rules_key: excepted_rules
